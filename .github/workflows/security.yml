name: Security checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  codeql:
    name: CodeQL JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Dependency review (requires repository dependency graph)
        id: dependency_review
        continue-on-error: true
        uses: actions/dependency-review-action@v4
      - name: Record unavailable dependency graph
        if: steps.dependency_review.outcome == 'failure'
        run: echo '::warning::GitHub dependency review is unavailable until Dependency graph is enabled in repository security settings; CodeQL remains mandatory.'
