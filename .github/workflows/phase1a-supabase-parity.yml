name: Finora Phase 1A Supabase CLI parity (isolated)
on:
  push:
    branches:
      - feature/finora-phase1a-supabase-cli-20261016
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finora-phase1a-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase-cli-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Validate migration history against read-only Production snapshot (NO PUSH)
        run: node scripts/phase1a-migration-preflight.mjs
      - name: Prepare local Supabase config (no remote project linked)
        run: |
          supabase init --force
          supabase --version
          docker --version
      - name: Normalize literal terminal backslash-n in ephemeral CI checkout only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          count=0
          for path in Path('supabase/migrations').glob('*.sql'):
              data=path.read_bytes()
              if data.endswith(b'\\n'):
                  path.write_bytes(data[:-2]+b'\n')
                  count+=1
          print(f'CI-only migration terminal-escape normalization: {count} files')
          if not count:
              print('No normalization needed')
          PY
          echo 'WARNING: normalization changes disposable CI checkout only, not Git blobs or Production.'
      - name: Isolate 1A migrations until AFTER baseline schema comparison
        run: |
          mkdir -p /tmp/finora-phase1a-migrations
          mv supabase/migrations/20261016100000_phase1a_server_journal_invariants.sql /tmp/finora-phase1a-migrations/
          mv supabase/migrations/20261016100500_phase1a_optimistic_version_sync.sql /tmp/finora-phase1a-migrations/
          mv supabase/migrations/20261016101000_phase1a_guard_modes_audit.sql /tmp/finora-phase1a-migrations/
          mv supabase/migrations/20261016101500_phase1a_journal_core.sql /tmp/finora-phase1a-migrations/
          mv supabase/migrations/20261016102000_phase1a_journal_rpc_surface.sql /tmp/finora-phase1a-migrations/
      - name: Start isolated Supabase stack and replay baseline migrations
        id: local_stack
        run: supabase start
      - name: Compare BASELINE catalog to read-only Production schema fingerprints
        id: baseline_parity
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -qAt -v ON_ERROR_STOP=1 -f supabase/tests/phase1a_schema_fingerprint.sql > phase1a-local-schema.json
          if node scripts/phase1a-schema-diff.mjs supabase/tests/fixtures/phase1a_production_schema_fingerprints_20261016.json phase1a-local-schema.json; then
            echo 'matched=true' >> "$GITHUB_OUTPUT"
          else
            echo 'matched=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Unreconciled baseline schema function-definition differences. Finance assertions will still run.'
          fi
      - name: Identify actual versus formatting-only function definition drift
        id: func_drift
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -qAt -v ON_ERROR_STOP=1 -f supabase/tests/phase1a_function_fingerprint.sql > phase1a-local-functions.json
          if node scripts/phase1a-classify-function-drift.mjs supabase/tests/fixtures/phase1a_production_function_semantics_20261016.json phase1a-local-functions.json; then
            echo 'class_ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'class_ok=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Token-by-token function comparison preserving quoted SQL literals
        id: function_token_parity
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -qAt -v ON_ERROR_STOP=1 -f supabase/tests/phase1a_function_sources.sql > phase1a-local-function-sources.json
          node scripts/phase1a-lexical-compare.mjs supabase/tests/fixtures/phase1a_production_lexical_tokens_20261016.json phase1a-local-function-sources.json
      - name: Apply 1A-only migrations on disposable Supabase CLI database
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f /tmp/finora-phase1a-migrations/20261016100000_phase1a_server_journal_invariants.sql
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f /tmp/finora-phase1a-migrations/20261016100500_phase1a_optimistic_version_sync.sql
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f /tmp/finora-phase1a-migrations/20261016101000_phase1a_guard_modes_audit.sql
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f /tmp/finora-phase1a-migrations/20261016101500_phase1a_journal_core.sql
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f /tmp/finora-phase1a-migrations/20261016102000_phase1a_journal_rpc_surface.sql
      - name: Run 1A green-after-red authenticated adversarial tests
        run: node scripts/phase1a-adversarial-red.mjs
      - name: Test 1A versioned CAS and two-tenant RLS
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f supabase/tests/phase1a_cas_rls_behavior.sql
      - name: 1000 random postings and compensating reversals
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f supabase/tests/phase1a_property_1000.sql
      - name: Benchmark 10000 journal vouchers and scoped indexed line lookup
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f supabase/tests/phase1a_10000_voucher_index_benchmark.sql
      - name: Enforce deferred posting balance in actual server transactions
        run: node scripts/phase1a-deferred-posting-test.mjs
      - name: Verify privileged helper search_path and anon execution grants
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f supabase/tests/phase1a_security_grants.sql
      - name: Exercise 1A rollback/down/re-up without losing data or versions
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f supabase/tests/phase1a_rollback_up_down_up.sql
      - name: Validate client JavaScript syntax
        run: node --check js/sync.js
      - name: Positive contract of existing JS journal draft and posted flows
        run: node scripts/phase1a-positive-client-contract.mjs
      - name: Require baseline schema parity modulo lexical-equivalent function formatting
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const a=JSON.parse(fs.readFileSync('phase1a-schema-diff.json'));
            const b=JSON.parse(fs.readFileSync('phase1a-lexical-diff.json'));
            const c=JSON.parse(fs.readFileSync('phase1a-function-classification.json'));
            const nonFunctions=a.D_sameIdentityDifferentDefinition.filter(x=>!x.startsWith('function|'));
            if(a.B_productionOnly.length || a.C_repositoryOnly.length || nonFunctions.length ||
               b.bodyMismatch.length || b.productionOnly.length || b.localOnly.length ||
               c.findings.metadataChanged.length) {
              console.error('SCHEMA_PARITY_FAIL: unreviewed material schema drift');
              process.exit(1);
            }
            console.log('SCHEMA_PARITY_PASS: 1069 baseline objects, 154 lexically identical function bodies and matching function metadata');
          "
      - name: Upload schema fingerprint diff (no private row data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finora-phase1a-schema-parity-${{ github.sha }}
          path: |
            phase1a-schema-diff.json
            phase1a-local-schema.json
            phase1a-function-classification.json
            phase1a-lexical-diff.json
            phase1a-migration-preflight.json
          retention-days: 7
          if-no-files-found: ignore
