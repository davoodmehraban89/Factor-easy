name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: JavaScript syntax
        run: node scripts/syntax-check.mjs
      - name: Application invariants
        run: node scripts/quality-check.mjs
      - name: Phase 2 accounting foundation invariants
        run: node scripts/phase2-check.mjs
      - name: Phase 3 double-entry invariants
        run: node scripts/phase3-check.mjs
      - name: Phase 3 behavioral accounting scenarios
        run: node scripts/phase3-behavior-check.mjs
      - name: Phase 4 accounting invariants
        run: node scripts/phase4-behavior-check.mjs
      - name: Phase 5 complementary ERP invariants
        run: node scripts/phase5-behavior-check.mjs
      - name: Iran enterprise payroll and service-period behavior
        run: node scripts/enterprise-behavior-check.mjs
      - name: Phase 6 reporting and reconciliation scenarios
        run: node scripts/phase6-behavior-check.mjs
      - name: Golden accounting core journey
        run: node scripts/golden-accounting-core-check.mjs
      - name: Modular ERP and office automation invariants
        run: node scripts/platform-office-check.mjs
      - name: Slice B tenant and RBAC invariants
        run: node scripts/slice-b-rbac-check.mjs
      - name: Enterprise license seats and delegated admin invariants
        run: node scripts/enterprise-license-check.mjs
      - name: Reusable organization roles invariants
        run: node scripts/enterprise-role-check.mjs
      - name: Secure organization invitation invariants
        run: node scripts/enterprise-invitation-check.mjs
      - name: Enterprise organization UX invariants
        run: node scripts/enterprise-org-ux-check.mjs
      - name: Office Slice C1 invariants
        run: node scripts/office-slice-c1-check.mjs
      - name: Office Slice C2 invariants
        run: node scripts/office-slice-c2-check.mjs
      - name: Office Slice C3 invariants
        run: node scripts/office-slice-c3-check.mjs
      - name: Office Slice C4 invariants
        run: node scripts/office-slice-c4-check.mjs
      - name: Office Slice C5 invariants
        run: node scripts/office-slice-c5-check.mjs
      - name: Office Slice C6 invariants
        run: node scripts/office-slice-c6-check.mjs
      - name: Office Slice C7 invariants
        run: node scripts/office-slice-c7-check.mjs
      - name: Office Slice C8 policy UI invariants
        run: node scripts/office-slice-c8-check.mjs
      - name: Request Workflow Slice D1 foundation invariants
        run: node scripts/request-workflow-d1-check.mjs
      - name: Request Workflow Slice D1 transition evidence invariants
        run: node scripts/request-workflow-d1-transition-check.mjs
      - name: Request Workflow Slice D1 RPC security invariants
        run: node scripts/request-workflow-d1-security-check.mjs
      - name: Request Workflow Slice D2 UI/read-model invariants
        run: node scripts/request-workflow-d2-check.mjs
      - name: Request Workflow Slice D3b visual/condition/timeline invariants
        run: node scripts/request-workflow-d3b-check.mjs
      - name: Request Workflow Slice D3c operations invariants
        run: node scripts/request-workflow-d3c-check.mjs
      - name: Request Workflow Slice D4a work queue invariants
        run: node scripts/request-workflow-d4a-check.mjs
      - name: Install browser smoke-test runtime
        run: |
          npm install --no-save @playwright/test@1.55.0 pdf-lib@1.17.1
          npx playwright install --with-deps chromium
      - name: Real DOM smoke
        run: |
          python3 -m http.server 4173 >/tmp/finora-http.log 2>&1 &
          npx playwright test scripts/dom-smoke.spec.js scripts/platform-office.spec.js scripts/enterprise-license.spec.js scripts/enterprise-role.spec.js scripts/enterprise-invitation.spec.js scripts/enterprise-org-ux.spec.js scripts/office-slice-c1.spec.js scripts/office-slice-c2.spec.js scripts/office-slice-c3.spec.js scripts/office-slice-c4.spec.js scripts/office-slice-c5.spec.js scripts/office-slice-c6.spec.js scripts/office-slice-c7.spec.js scripts/office-slice-c8.spec.js scripts/office-slice-c8-runtime.spec.js scripts/request-workflow-d2.spec.js scripts/request-workflow-d3b.spec.js scripts/request-workflow-d3c.spec.js scripts/request-workflow-d4a.spec.js scripts/taxpayer-print.spec.js scripts/pages-artifact.spec.js --reporter=line --workers=1

  c8-policy-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finora_c8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finora_c8"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: finora_c8
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable C8 database
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d finora_c8 -f supabase/tests/office_c8_bootstrap.sql
      - name: Apply C8 policy migration
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d finora_c8 -f supabase/migrations/20261001173917_office_slice_c8_workflow_policy.sql
      - name: Execute C8 policy behavioral assertions
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d finora_c8 -f supabase/tests/office_c8_workflow.sql
      - name: Apply archived C8 runtime migration
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d finora_c8 -f supabase/migrations/20261001180610_office_slice_c8_workflow_runtime.sql
      - name: Apply C8 FK index hardening
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d finora_c8 -f supabase/migrations/20261001180949_office_c8_policy_publisher_fk_index.sql
      - name: Execute C8 runtime transactional assertions
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d finora_c8 -f supabase/tests/office_c8_runtime.sql
      - name: Execute C8 two-session concurrency assertion
        run: node scripts/office-c8-concurrency.mjs
      - name: Execute C8 private-entry and index assertions
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d finora_c8 -f supabase/tests/office_c8_runtime_security.sql

  d1-request-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finora_d1
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finora_d1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: 5433
      PGUSER: postgres
      PGDATABASE: finora_d1
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable D1 database
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/request_d1_bootstrap.sql
      - name: Apply D1 foundation
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001204500_request_workflow_d1_foundation.sql
      - name: Apply D1 transition evidence hardening
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001205500_request_workflow_d1_transition_evidence.sql
      - name: Apply D1 RPC security hardening
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001210500_request_workflow_d1_rpc_security.sql
      - name: Apply D1 revision qualification
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001211500_request_workflow_d1_revision_qualification.sql
      - name: Execute D1 behavioral assertions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/request_d1_behavior.sql
      - name: Seed legacy request records for D2 cutover
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/request_d2_legacy_seed.sql
      - name: Apply D2 non-destructive legacy cutover
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001223500_request_workflow_d2_legacy_cutover.sql
      - name: Apply D2 request workflow FK indexes
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001224500_request_workflow_d2_fk_indexes.sql
      - name: Execute D2 legacy cutover assertions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/request_d2_legacy_behavior.sql
      - name: Apply D3a step runtime
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001230000_request_workflow_d3a_step_runtime.sql
      - name: Execute D3a sequential and parallel workflow assertions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/request_d3a_workflow_behavior.sql
      - name: Apply Wave 1 legacy transition guard
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261002010000_request_wave1_legacy_transition_guard.sql
      - name: Execute Wave 1 adversarial legacy transition assertions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/request_wave1_legacy_transition_security.sql
      - name: Apply D3b conditions and timeline
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001233000_request_workflow_d3b_conditions_timeline.sql
      - name: Apply Wave 2 request integrity hardening
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261002023000_request_wave2_integrity_hardening.sql
      - name: Execute D3b condition and timeline assertions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/request_d3b_condition_timeline.sql
      - name: Execute Wave 2 request integrity assertions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/request_wave2_integrity.sql
      - name: Apply D3c SLA delegation and outbox
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261001235500_request_workflow_d3c_operations.sql
      - name: Apply D3c escalation idempotency fix
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261002000500_request_workflow_d3c_escalation_conflict_fix.sql
      - name: Execute D3c operational assertions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/request_d3c_operations.sql
      - name: Apply D4a authorized work queue
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261002033000_request_workflow_d4a_work_queue.sql
      - name: Execute D4a work queue assertions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/request_d4a_work_queue.sql
