name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: JavaScript syntax
        run: node scripts/syntax-check.mjs
      - name: Application invariants
        run: node scripts/quality-check.mjs
      - name: Phase 2 accounting foundation invariants
        run: node scripts/phase2-check.mjs
      - name: Phase 3 double-entry invariants
        run: node scripts/phase3-check.mjs
      - name: Phase 3 behavioral accounting scenarios
        run: node scripts/phase3-behavior-check.mjs
      - name: Phase 4 accounting invariants
        run: node scripts/phase4-behavior-check.mjs
      - name: Phase 5 complementary ERP invariants
        run: node scripts/phase5-behavior-check.mjs
      - name: Iran enterprise payroll and service-period behavior
        run: node scripts/enterprise-behavior-check.mjs
      - name: Phase 6 reporting and reconciliation scenarios
        run: node scripts/phase6-behavior-check.mjs
      - name: Golden accounting core journey
        run: node scripts/golden-accounting-core-check.mjs
      - name: Modular ERP and office automation invariants
        run: node scripts/platform-office-check.mjs
      - name: Slice B tenant and RBAC invariants
        run: node scripts/slice-b-rbac-check.mjs
      - name: Enterprise license seats and delegated admin invariants
        run: node scripts/enterprise-license-check.mjs
      - name: Reusable organization roles invariants
        run: node scripts/enterprise-role-check.mjs
      - name: Secure organization invitation invariants
        run: node scripts/enterprise-invitation-check.mjs
      - name: Enterprise organization UX invariants
        run: node scripts/enterprise-org-ux-check.mjs
      - name: Office Slice C1 invariants
        run: node scripts/office-slice-c1-check.mjs
      - name: Office Slice C2 invariants
        run: node scripts/office-slice-c2-check.mjs
      - name: Office Slice C3 invariants
        run: node scripts/office-slice-c3-check.mjs
      - name: Office Slice C4 invariants
        run: node scripts/office-slice-c4-check.mjs
      - name: Office Slice C5 invariants
        run: node scripts/office-slice-c5-check.mjs
      - name: Office Slice C6 invariants
        run: node scripts/office-slice-c6-check.mjs
      - name: Office Slice C7 invariants
        run: node scripts/office-slice-c7-check.mjs
      - name: Office Slice C8 policy UI invariants
        run: node scripts/office-slice-c8-check.mjs
      - name: Install browser smoke-test runtime
        run: |
          npm install --no-save @playwright/test@1.55.0 pdf-lib@1.17.1
          npx playwright install --with-deps chromium
      - name: Real DOM smoke
        run: |
          python3 -m http.server 4173 >/tmp/finora-http.log 2>&1 &
          npx playwright test scripts/dom-smoke.spec.js scripts/platform-office.spec.js scripts/enterprise-license.spec.js scripts/enterprise-role.spec.js scripts/enterprise-invitation.spec.js scripts/enterprise-org-ux.spec.js scripts/office-slice-c1.spec.js scripts/office-slice-c2.spec.js scripts/office-slice-c3.spec.js scripts/office-slice-c4.spec.js scripts/office-slice-c5.spec.js scripts/office-slice-c6.spec.js scripts/office-slice-c7.spec.js scripts/office-slice-c8.spec.js scripts/taxpayer-print.spec.js --reporter=line --workers=1

  c8-policy-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finora_c8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finora_c8"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: finora_c8
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable C8 database
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d finora_c8 -f supabase/tests/office_c8_bootstrap.sql
      - name: Apply C8 policy migration
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d finora_c8 -f supabase/migrations/20261001173917_office_slice_c8_workflow_policy.sql
      - name: Execute C8 policy behavioral assertions
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d finora_c8 -f supabase/tests/office_c8_workflow.sql
      - name: Apply archived C8 runtime migration
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d finora_c8 -f supabase/migrations/20261001180610_office_slice_c8_workflow_runtime.sql
      - name: Execute C8 runtime transactional assertions
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d finora_c8 -f supabase/tests/office_c8_runtime.sql
      - name: Execute C8 two-session concurrency assertion
        run: node scripts/office-c8-concurrency.mjs
      - name: Execute C8 private-entry and index assertions
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d finora_c8 -f supabase/tests/office_c8_runtime_security.sql
