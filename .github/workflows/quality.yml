name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node scripts/syntax-check.mjs
      - name: Application invariants
        run: node scripts/quality-check.mjs
      - name: Phase 2 accounting foundation invariants
        run: node scripts/phase2-check.mjs
      - name: Phase 3 double-entry invariants
        run: node scripts/phase3-check.mjs
      - name: Phase 3 behavioral accounting scenarios
        run: node scripts/phase3-behavior-check.mjs
