name: FINORA Stage3 payload regression - disposable Supabase
on:
  push:
    branches: [work/finora-stage3-payload-green-20261023]
permissions:
  contents: read
concurrency:
  group: finora-stage3-payload-isolated
  cancel-in-progress: true

# No hosted staging URL. No paid resources, Production secrets, DB or deployment.
# Public-repo standard ubuntu-latest runners are free; no stored CI artifacts.
jobs:
  stage22-real-stack:
    name: stage22-real-stack (NOT harness)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Preconnection production target canary
        run: node scripts/stage21-target-preflight.mjs green
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start disposable Supabase Auth PostgREST gateway and Stage1 + Stage2.2 SQL
        run: |
          set -euo pipefail
          supabase init --force
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('supabase/migrations').glob('*.sql'):
              b=p.read_bytes()
              if b.endswith(b'\\n'): p.write_bytes(b[:-2]+b'\n')
          PY
          mkdir -p /tmp/stage22-real-migrations
          mv supabase/migrations/2026101610{0000,0500,1000,1500,2000,2500,3000,3100,3500,4000}_*.sql /tmp/stage22-real-migrations/
          supabase start -x inbucket
          for migration in /tmp/stage22-real-migrations/*.sql; do
            PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
      - name: Build exact production Pages artifact (no deployment)
        run: |
          node scripts/build-pages.mjs
          test -f _site/index.html
          test -f _site/js/finora-pages-accounting.js
          test -f _site/js/finora-extension-bundle.js
      - name: Install Chromium and Playwright real-stack runner
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: REAL STACK GoTrue login, JWT gateway REST attacks, UI journal and audit
        run: |
          set -o pipefail
          node scripts/stage22-real-stack.mjs 2>&1 | tee stage22-real-stack.log
      - name: Annotate REAL STACK job (never confuse with harness)
        if: always()
        run: |
          {
            echo '### Stage 2.2 REAL-STACK (not harness)'
            echo 'Real built Pages index, local GoTrue Auth, JWT, Kong/gateway, PostgREST, real PostgreSQL and Chromium.'
            echo 'Result: see mandatory scenario log and evidence; no result is certified on a failed job.'
            echo 'No remote Supabase URL, Production SQL, deployment or Production credentials.'
          } >> "$GITHUB_STEP_SUMMARY"
  stage22-mode-contract:
    name: client-compat-positive-stage2
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Local target preflight (never Production)
        run: node scripts/stage21-target-preflight.mjs green
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Isolate local CLI and apply only Stage1 and Stage2.2 mode SQL
        run: |
          supabase init --force
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('supabase/migrations').glob('*.sql'):
              b=p.read_bytes()
              if b.endswith(b'\\n'): p.write_bytes(b[:-2]+b'\n')
          PY
          mkdir -p /tmp/stage22-only
          mv supabase/migrations/2026101610{0000,0500,1000,1500,2000,2500,3000,3100,3500,4000}_*.sql /tmp/stage22-only/
          supabase start -x inbucket
          for migration in /tmp/stage22-only/*.sql; do
            PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Owner-only mode RPC and guard in real local database
        run: |
          set -o pipefail
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f supabase/tests/stage22_mode_contract.sql 2>&1 | tee stage22-mode.log
      - name: Legacy client direct posted-status write must remain denied in enforce
        run: |
          set -o pipefail
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -v stage21phase=green -f supabase/tests/stage21_direct_post_canary.sql 2>&1 | tee stage22-legacy-negative.log
      - name: Browser manual journal lifecycle on Ubuntu + local database
        run: |
          set -o pipefail
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          node scripts/stage22-manual-browser.mjs 2>&1 | tee stage22-browser.log
      - name: Strict 3-of-3 positive manual client contract gate
        run: |
          set -o pipefail
          node scripts/stage22-client-compat-gate.mjs stage22-evidence.json 2>&1 | tee stage22-compat.log
      - name: Annotate HARNESS job type explicitly
        if: always()
        run: |
          {
            echo '### Stage 2.2 HARNESS (NOT real-stack)'
            echo 'Runs original journal UI JavaScript in Chromium and tests local PostgreSQL through a restricted psql test bridge.'
            echo 'Does NOT verify GoTrue password login, a real bearer JWT, gateway/PostgREST, or browser-to-backend HTTP.'
            echo 'The separate stage22-real-stack job is mandatory before claiming full integration.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Label local PostgreSQL bridge as HARNESS (not real-stack)
        if: always()
        run: |
          {
            echo '### Stage 2.2 HARNESS (not real-stack)'
            echo 'Chromium executes actual journal code/UI via an isolated test-only PostgreSQL bridge and mocked Supabase transport.'
            echo 'This pass does NOT prove real GoTrue auth, browser HTTP PostgREST, or the built Pages entrypoint.'
            echo 'Real-stack is a SEPARATE job and must independently pass.'
          } >> "$GITHUB_STEP_SUMMARY"
  stage22-exact-head-parity:
    name: stage22-exact-head-parity (snapshot NOT live Production)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Refuse Production target before any DB connection
        run: node scripts/stage21-target-preflight.mjs green
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Strict Stage1 migration preflight with separately approved Stage2.2 excluded ONLY from Stage1 history
        run: |
          set -euo pipefail
          test -f supabase/migrations/20261016104000_stage22_manual_guard_owner_mode.sql
          mv supabase/migrations/20261016104000_stage22_manual_guard_owner_mode.sql /tmp/stage22-owner-guard-approved-only-local.sql
          node scripts/phase1a-migration-preflight.mjs
          mv /tmp/stage22-owner-guard-approved-only-local.sql supabase/migrations/20261016104000_stage22_manual_guard_owner_mode.sql
          test -f supabase/migrations/20261016104000_stage22_manual_guard_owner_mode.sql
      - name: Start unlinked local Supabase with Stage 1 and 2.2 migrations isolated
        run: |
          set -euo pipefail
          supabase init --force
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('supabase/migrations').glob('*.sql'):
              b=p.read_bytes()
              if b.endswith(b'\\n'): p.write_bytes(b[:-2]+b'\n')
          PY
          mkdir -p /tmp/stage22-head-migrations
          mv supabase/migrations/2026101610{0000,0500,1000,1500,2000,2500,3000,3100,3500,4000}_*.sql /tmp/stage22-head-migrations/
          supabase start -x inbucket
      - name: Rebuild baseline and require all 1069 object identities and non-function definitions (raw hash diagnostic)
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -qAt -v ON_ERROR_STOP=1 -f supabase/tests/phase1a_schema_fingerprint.sql > stage22-head-baseline-objects.json
          node scripts/stage22-baseline-structural-gate.mjs 2>&1 | tee stage22-parity-baseline.log
      - name: Require token-aware baseline SQL function parity, not just whitespace
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -qAt -v ON_ERROR_STOP=1 -f supabase/tests/phase1a_function_sources.sql > stage22-head-baseline-functions.json
          node scripts/phase1a-lexical-compare.mjs supabase/tests/fixtures/phase1a_production_lexical_tokens_20261016.json stage22-head-baseline-functions.json 2>&1 | tee stage22-parity-functions.log
      - name: Classify ALL function metadata and raw format differences (diagnostic, strictly gated next)
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -qAt -v ON_ERROR_STOP=1 -f supabase/tests/phase1a_function_fingerprint.sql > stage22-head-baseline-function-metadata.json
          set +e
          node scripts/phase1a-classify-function-drift.mjs supabase/tests/fixtures/phase1a_production_function_semantics_20261016.json stage22-head-baseline-function-metadata.json 2>&1 | tee stage22-parity-classification.log
          exit_code=${PIPESTATUS[0]}
          set -e
          if [ "$exit_code" -gt 1 ]; then
            echo 'Invalid function classification tool failure'; exit "$exit_code"
          fi
          test -s phase1a-function-classification.json
      - name: HARD GATE entire baseline identity plus 154 lexical-equivalent functions and metadata
        run: node scripts/stage22-baseline-final-gate.mjs 2>&1 | tee stage22-parity-verdict.log
      - name: Apply ordered Stage 1 + 2.2 migrations ONLY to local PostgreSQL
        run: |
          set -euo pipefail
          for migration in /tmp/stage22-head-migrations/*.sql; do
            PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
          echo 'STAGE22_ORDERED_LOCAL_MIGRATIONS_APPLIED' | tee stage22-migrations.log
      - name: Require real owner-only, CAS, append-only audit, opening and closing denial
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f supabase/tests/stage22_mode_contract.sql 2>&1 | tee stage22-parity-mode.log
      - name: Require authenticated direct posted-status negative under enforce
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -v stage21phase=green -f supabase/tests/stage21_direct_post_canary.sql 2>&1 | tee stage22-parity-direct-write.log
      - name: Strict standalone all-definer grants audit
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f supabase/tests/phase1a_stage1_all_definer_security.sql 2>&1 | tee stage22-parity-definer-security.log
      - name: Clearly classify snapshot-vs-live and test layer in Job Summary
        if: always()
        run: |
          {
            echo '### Stage 2.2 EXACT HEAD SQL PARITY — LOCAL POSTGRES'
            echo 'Compares 2026-10-16 Production snapshot; live Production parity was separately checked READ-ONLY, not by this CI job.'
            echo 'Strict parity uses 1069 object identities/nonfunction hashes, 154 lexer-identical SQL function bodies, and equal function metadata.'
            echo 'Later SQL migrations and authenticated negative tests use isolated unlinked Supabase CLI.'
            echo 'Distinct from harness and real-stack browser tests, which run in other jobs.'
            echo 'FAILURE is not acceptance; read step and raw log.'
          } >> "$GITHUB_STEP_SUMMARY"

  stage1-rollback-rehearsal:
    name: Stage 1 local UP-DOWN-UP preserves versions/data (NOT Production rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject all remote targets before any test connection
        run: node scripts/stage21-target-preflight.mjs green
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Prepare separate local-only baseline and Stage 1 migrations
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SUPABASE_ACCESS_TOKEN:-}" || exit 1
          test -z "${SUPABASE_DB_PASSWORD:-}" || exit 1
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}" || exit 1
          supabase init --force
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('supabase/migrations').glob('*.sql'):
              b=p.read_bytes()
              if b.endswith(b'\\n'): p.write_bytes(b[:-2]+b'\n')
          PY
          mkdir -p /tmp/finora-phase1a-migrations
          mv supabase/migrations/2026101610{0000,0500,1000,1500,2000,2500,3000,3100,3500}_*.sql /tmp/finora-phase1a-migrations/
          mv supabase/migrations/20261016104000_stage22_manual_guard_owner_mode.sql /tmp/stage22-guard-not-applied.sql
          supabase start -x inbucket
          for migration in /tmp/finora-phase1a-migrations/*.sql; do
            PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
      - name: Rehearse 1A rollback and forward without data or CAS loss
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f supabase/tests/phase1a_rollback_up_down_up.sql 2>&1 | tee stage1-local-rollback.log
          grep -q 'FINORA_1A_ROLLBACK_UP_DOWN_UP_PASS' stage1-local-rollback.log
      - name: Label reversible synthetic rehearsal, never Production recovery approval
        if: always()
        run: |
          {
            echo '### Stage 1 rollback test — ephemeral local PostgreSQL ONLY'
            echo 'No Production connection, no real records, no remote Supabase branch, no artifacts.'
            echo 'Successful reversible synthetic UP/DOWN/UP does NOT prove a Production rollback.'
          } >> "$GITHUB_STEP_SUMMARY"

  stage3-ui-sql-v1:
    name: Real UI sale-purchase payload vs independent SQL-v1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fail closed on all remote Supabase targets
        run: node scripts/stage21-target-preflight.mjs green
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Build isolated unlinked PostgreSQL with Stage1 source contract
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SUPABASE_ACCESS_TOKEN:-}" || exit 1
          test -z "${SUPABASE_DB_PASSWORD:-}" || exit 1
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}" || exit 1
          supabase init --force
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('supabase/migrations').glob('*.sql'):
              data=p.read_bytes()
              if data.endswith(b'\\n'): p.write_bytes(data[:-2]+b'\n')
          PY
          mkdir -p /tmp/finora-stage3-ui-contract-migrations
          mv supabase/migrations/2026101610{0000,0500,1000,1500,2000,2500,3000,3100,3500,4000}_*.sql /tmp/finora-stage3-ui-contract-migrations/
          supabase start -x inbucket
          for migration in /tmp/finora-stage3-ui-contract-migrations/*.sql; do
            PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
      - name: Install pinned Chromium Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Produce source JSON from actual synthetic sale and purchase forms
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/finora-stage3-ui.log 2>&1 &
          npx playwright test scripts/accounting-document-workflow.spec.js --grep 'Stage3 new sale and purchase UI' --workers=1 --reporter=line
          test -s stage3-ui-fixtures.json
      - name: Independently validate actual UI JSON against PostgreSQL SQL-v1
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage3-ui-sql-v1-check.mjs stage3-ui-fixtures.json 2>&1 | tee stage3-ui-sql.log
          grep -q 'FINORA_STAGE3_UI_SQL_V1_PASS' stage3-ui-sql.log
      - name: Real local GoTrue JWT authenticated source posting and replay controls
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage3-real-jwt-source-post.mjs stage3-ui-fixtures.json 2>&1 | tee stage3-source-jwt.log
          grep -q 'FINORA_STAGE3_REAL_JWT_AUTOPOST_PASS' stage3-source-jwt.log
      - name: Record local stage3 synthetic SQL scope
        if: always()
        run: |
          {
            echo '### Stage3 actual UI to real PostgreSQL contract'
            echo 'New form payloads only; local SQL-v1 evaluated on isolated unlinked Supabase/Postgres.'
            echo 'No private user data, no Production Auth, no hosted Staging and NO deployment.'
            echo 'Failing source contract is a genuine Stage3 BLOCKER, never waive it.'
          } >> "$GITHUB_STEP_SUMMARY"
